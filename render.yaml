services:
  - type: web
    name: resolvr-backend
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_HOST
        fromDatabase:
          name: resolvr-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: resolvr-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: resolvr-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: resolvr-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: resolvr-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173

databases:
  - name: resolvr-db
    databaseName: resolvr_db
    user: resolvr_app
    plan: free
    region: oregon
