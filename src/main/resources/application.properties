# Server Configuration
server.port=8082
server.servlet.context-path=/

# Application Information
spring.application.name=resolvr-backend
app.auth.admin-email=${ADMIN_EMAIL:sathwikgoudgundrathi@gmail.com}
app.auth.worker-email=${WORKER_EMAIL:bhairav@gmail.com}

# MySQL Database Configuration
# Default connects to local MySQL 'resolvr_db', creates database automatically if missing
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:resolvr_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Frontend origins allowed to use the session-cookie API (comma-separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://localhost:8081,http://127.0.0.1:8080,http://127.0.0.1:8081}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
